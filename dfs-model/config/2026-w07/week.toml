# Week 7 settings (2026-w07). Made Oct 18 from 2026-w06's week.toml with the week-specific parts emptied.
# Overrides any key in config/defaults.toml. Standing rules come from defaults: starters only, 25-lineup cap, leverage off,
# and from week 7 the salary floor ($59,000, cap relief to 28 for floor lineups only) and skip_defense_names.
# Mode carried from week 6 (Doug): RED and YELLOW reads APPLIED ([prefs]); GREEN recorded under [shadow] only.
# Schedule (nflverse, Oct 18): main slate = Sunday 1:00 / 4:05 / 4:25 ET, likely 10 games: SF@ATL, CIN@BAL, TB@CAR,
# NYG@HOU, IND@MIN, MIA@NYJ, CLE@TEN, DEN@ARI, GB@DET, LAR@LV. Off the main slate: NE@CHI (Thu), PIT@NO (London 9:30),
# KC@SEA (SNF), DAL@PHI (MNF). Byes: BUF, JAX, LAC, WAS. Confirm against FanDuel's player list.

# FRIDAY (Oct 23): Doug's week-7 statuses from Friday's report. Conventions: Out and Doubtful -> out (Montgomery
# doubtful -> out), Questionable Doug expects to play -> active (not listed), uncertain Questionable -> questionable
# (held out, no redistribution). IR players with real 2026 volume stay out (Oct 13 rule) unless Doug says they return.
# Off the main slate, so not listed: Rashee Rice, Ben Skowronek, Tyrell Shavers, Brashard Smith, Zach Charbonnet,
# Rico Dowdle, DeVonta Smith, Dallas Goedert, George Pickens, Saquon Barkley, DJ Moore.
# Active Q per Doug (expected to play): Baker Mayfield, Jaylen Wright, Caleb Douglas, Adonai Mitchell, T.J. Hockenson
# (all red, so still in no lineup). Quinshon Judkins is not on the report: plays (red; no Estime read needed).
# If Puka Nacua is ruled OUT before Sunday: move him from questionable to out (his targets route to Mumpfield etc.).
[status]
out = [
  # Friday's report (Doug, Oct 23)
  "Jeremiyah Love", "Brian Robinson Jr.", "Tyler Warren", "Emeka Egbuka", "Anthony Gould", "Deebo Samuel Sr.",
  "David Montgomery",                                                    # doubtful -> out
  "Davante Adams",                                                       # FanDuel O (hamstring), Oct 19
  # IR with real 2026 volume (targets + carries a game); Jordan Mason returned (see active)
  "De'Von Achane",                                                       # MIA 15.3
  "Jonah Coleman", "Pat Bryant",                                         # DEN 6.5, 3.2
  "Jonathon Brooks", "Xavier Legette",                                   # CAR 6.0, 3.0
  "Ronnie Rivers", "Terrance Ferguson",                                  # LAR 6.0, 4.0
  "Chris Brooks", "Jayden Reed",                                         # GB 5.0, 4.0
  "Raheim Sanders",                                                      # CLE 4.2
  "Alec Pierce",                                                         # IND 3.5
  "Jack Bech",                                                           # LV 3.0
  "Demarcus Robinson",                                                   # SF 3.0
]
questionable = [   # Doug, Oct 23: uncertain, held out, no redistribution
  "Puka Nacua", "Lamar Jackson",                                         # Lamar: Doug decides Sunday
  "Breece Hall", "Calvin Ridley", "Mike Evans", "Jaylen Waddle", "Mike Washington Jr.", "Tyjae Spears",
]
# Back from IR (Doug, Oct 23): active, no redistribution. FanDuel's Oct 19 list still tags them IR; this clears it.
active = ["Tank Dell", "Jordan Mason", "Beaux Collins"]

# Doug's starting-QB calls, team -> name. Default is the QB with the most attempts in the team's last game.
[status.starting_qb]
# Doug, Oct 23: Mayfield active (Q, expected to play); last game's attempts would make Jalon Daniels the starter.
# Mayfield is red, so TB is not stacked. BAL: Huntley by default (most attempts last game); Lamar decided Sunday.
TB = "Baker Mayfield"

# Traded players (see config/2026-w06/week.toml for the full notes).
# Week 7: Houston is on the main slate, so both sides of the Harrison trade run. Doug's read: settled share 0.15,
# first_week_factor 0.7 (Oct 19; 0.5 on Oct 18) -> 10.5% of Houston's targets this week. In London (week 6) he played 12 of ~59 snaps (~20%)
# with 4 of 32 targets (12.5%): docs/week6_review.md section 7.
[[status.trade]]
player = "Marvin Harrison Jr."
position = "WR"
from = "ARI"
to = "HOU"
new_target_share = 0.15        # Doug's settled read
first_week_factor = 0.7        # Doug, Oct 19 (was 0.5 on Oct 18 from ~20% of snaps in London) -> 10.5% of HOU targets

# Kaytron Allen (RB): real move (waiver claim WAS -> MIA after Achane's injury). No trade entry: Doug (Oct 19) wants
# him in no lineup, so he is red below. WAS is on bye and MIA teammates are only adjusted by a trade entry, so
# nobody else's projection is affected.

# Doug's projection reads: new mean FanDuel points.
[overrides]
# Doug, Oct 23: Aaron Jones Sr. left at the model's 14.1 (Jordan Mason back); no read.

# Week 6 ran the depth split for WRs only (Doug, Oct 12). Kept for week 7 unless Doug says otherwise.
[model.injury]
within_position = "depth_rank"
depth_rank_positions = ["WR"]
trade_old_team = "full"   # as entered: Harrison's ARI volume handed out in full (present_share became the default Oct 26)
questionable_routing = false     # as entered: questionable routing became the default Oct 26 (week 8)
questionable_inactive_prob = 0.25 # as entered (0.45 from week 8)

[optimizer]
stack_allocation = "proportional"   # stack counts follow the weights exactly instead of random draws
floor_cap_overflow = 3              # as entered: salary-floor cap relief +3 (the default became +1 on Oct 26)
# PRELIMINARY, pending Doug (Claude, Oct 22): with Doug's Oct 22 reds / yellows the model stalls at 147 lineups at cap 25
# (too few stackable teams). Standing rule: raise only if infeasible (to 40 at most). Smallest cap that builds 150 = 26,
# with the floor relief's usual +3 (players up to 29). Relief held at 28 fails at caps 26-28 (143-145 lineups).
# Doug, Oct 22: cap 26 for week 7 (reads limited the stackable teams); stays PRELIMINARY until the final run.
# Doug, Oct 22 (later): cap 27 after Kyren Williams / Aaron Jones became stack receivers (cap 26 then stalled at 149).
exposure_cap = 27

