# Rules that hold week to week. config/<week>/week.toml is deep-merged on top, so any key here can be overridden
# for a single week (e.g. [optimizer] exposure_cap = 40).

# --- FanDuel contest scoring (verified from Pooch Punt rules screenshot) ---
[scoring]
pass_yd = 0.04
pass_td = 4
interception = -1
rush_yd = 0.1
rush_td = 6
rec_yd = 0.1
rec_td = 6
reception = 0.5          # half PPR
return_td = 6
fumble_lost = -2
two_pt = 2
bonus = 3                # each of: 100+ rush yds, 100+ rec yds, 300+ pass yds
bonus_rush_yds = 100
bonus_rec_yds = 100
bonus_pass_yds = 300

[scoring.dst]
sack = 1
interception = 2
fumble_recovery = 2
return_td = 6
safety = 2
blocked_kick = 2
# points allowed (offensive TD/2pt/XP/FG only): pa < bound[i] scores points[i]; pa >= last bound scores pa_else
pa_bounds = [1, 7, 14, 21, 28, 35]
pa_points = [10, 7, 4, 1, 0, -1]
pa_else = -4

[roster]
salary_cap = 60000
max_per_team = 4                       # offensive players from one NFL team
slots = ["QB", "RB", "RB", "WR", "WR", "WR", "TE", "FLEX", "DEF"]   # upload header, exactly
flex = ["RB", "WR", "TE"]

[teams]
nflverse_to_fd = { JAX = "JAC", LA = "LAR" }

# --- Projection model ---
[model]
n_sims = 10000
seed = 42
league_team_total = 22.5       # implied total that maps to a 1.0 scoring multiplier
volume_elasticity = 0.5        # usage scales by 1 + e * (implied/league - 1)
season_types = ["REG"]

[model.correlation]            # team scoring multiplier = exp(N(0,team_sd) + N(0,game_sd) + shift), game draw shared by both teams
team_sd = 0.22
game_sd = 0.12
shift = -0.03

# league per-opportunity priors; k = pseudo-opportunities of shrinkage
[model.priors]
ypa = { mean = 6.8, k = 60 }
pass_td = { mean = 0.045, k = 80 }
int = { mean = 0.022, k = 80 }
ypc = { mean = 4.3, k = 40 }
rush_td = { mean = 0.03, k = 40 }
catch_rate = { mean = 0.65, k = 20 }
ypt = { mean = 7.8, k = 30 }
rec_td = { mean = 0.045, k = 30 }

[model.qb]
min_attempts = 15          # drop QB game rows below this (cameos) from the stats entirely
prior_attempts = 33        # one pseudo-game of attempts
att_sd = 0.12
yds_sd = 0.15
yds_team_exp = 0.6         # passing yards scale with team factor ** exp
zero_backups = true        # QBs who are not the week's starter project 0 (they used to carry a starter's projection)

[model.rush]
att_sd = 0.2
att_team_exp = 0.3
yds_sd = 0.3

[model.rec]
tgt_sd = 0.25
tgt_team_exp = 0.3
yds_sd = 0.35
catch_rate_max = 0.85
catch_rate_floor = 0.3     # floor on catch rate when converting yds/target to yds/catch

[model.dst]
sacks = 2.6
turnovers = 1.3
turnover_total_exp = 0.5   # turnovers scale with (league / opp implied) ** exp
return_td_prob = 0.08
quality_shrink = 0.5       # quality = (1-s) + s * FPPG / league DST FPPG

[model.dst.flatten]        # Oct 12 2026 (docs/week6_prep.md): DST mean from opponent implied total and salary only
enabled = true
opp_implied = -0.35        # points per point of opponent implied total above the slate average
salary_per_1k = 0.35       # points per $1,000 of salary above the slate average

[model.fallback]           # players with no usable stats: FD FPPG with wide noise
sd = 0.5
total_exp = 0.5
team_exp = 0.5

[model.injury]
redistribute_share = 0.8           # share of newly-OUT players' targets/carries given to active teammates, pro rata
questionable_inactive_prob = 0.25
absent_mode = "present_share"      # OUT players who already missed games (Oct 12 2026, docs/week6_prep.md):
                                   # "present_share" = hand out their volume for the share of each teammate's usage
                                   #   sample (current games + prior pseudo-games) they played in; fades as they stay out
                                   # "skip" = the Oct 10 behaviour, governed by skip_already_absent below
skip_already_absent = true         # absent_mode "skip" only: don't redistribute an OUT player who missed his team's last
                                   # game at all; false = hand everyone out in full (the behaviour before Oct 10 2026)

# Shrink applied to finished projections (fit by src/fit_calibration.py; docs/week6_prep.md). enabled = false turns it off.
[model.calibration]
enabled = true
mode = "shift"             # "shift" = lower the mean and keep the simulated spread (uncalibrated ceilings were about
                           # right: 10.9% of 16+ projections beat their p90); "scale" = shrink every draw in proportion
top_knee = 16.0            # every skill player: lose top_slope of each projected point above this
top_slope = 0.28           # fit Oct 12 2026 on 2025 wks 4-18 + 2026 wks 4-5 (leave-one-week-out range 0.20-0.32)
rb_knee = 8.0              # RBs: also lose rb_slope of each projected point above this
rb_slope = 0.12            # (leave-one-week-out range 0.09-0.14)

# Phase 2 #1: shrink current-season usage/efficiency toward the prior season.
# Prior season adds `usage_games` pseudo-games of its per-game targets/carries/attempts, and `efficiency_games` games'
# worth of its per-opportunity outcomes (yds, TDs, catches) before the league-prior shrink. 0 = off.
[model.prior_blend]
usage_games = 2.0         # tuned Oct 5 2026: docs/phase2_prior_blend.md
efficiency_games = 4.0
team_change_weight = 1.0    # multiplier on both weights when the player's prior-season team differs
min_prior_games = 4         # ignore prior seasons shorter than this (injury-shortened samples)

# --- Optimizer (Doug's standing rules) ---
[optimizer]
n_lineups = 150
seed = 11
exposure_cap = 25            # every player and DST; raise to 40 only if infeasible
mean_weight = 0.4            # objective = mean_weight * proj + (1 - mean_weight) * one sim draw
max_overlap = 6              # max shared players between any two lineups
min_proj = 4                 # drop non-DST players projected below this (unless green)
exclude_questionable = true  # Doug's standing rule: pull Q players (incl. FanDuel Q/D tags before Friday's [status])
questionable_cap_pct = 0.12  # cap on Q players when exclude_questionable = false
yellow_factor = 0.5          # yellow = cap at this share of current exposure
green_multiplier = 2         # green = min max(mult * current, floor)
green_floor = 12
relax_force_after = 3        # failed solves before dropping forced players one at a time
drop_force_after = 12
stack_allocation = "random"  # "random": one weighted team draw per lineup; "proportional": stack counts fixed from the
                             # weights (largest-remainder rounding), so counts match the weights
reserve_required = false     # true: other stacks leave room on a player a green QB's stack rule requires (see week 5)

[optimizer.starters]         # depth kept per team when prefs.starters_only (QB = week's starter)
RB = 1
WR = 3
TE = 1

[optimizer.starters_min_proj]   # with depth > 1: a team's 2nd, 3rd... player at the position must project at least this
                                # (e.g. starters RB = 2 with RB = 8 here: a second RB only when he projects 8+)

[optimizer.stack]            # QB + receivers from his team + bring-back from opponent; teams overridable in week.toml
receivers = 2
bring_back = 1

# --- Phase 2 #2: field ownership (docs/phase2_ownership.md) ---
# Projected %Drafted from pre-lock info, fit on every earlier week with data/<week>/results_players.csv (refit each run).
[ownership]
enabled = true               # add Own_proj to proj.csv / projections.csv / exposure.csv when earlier results exist
features = ["log_salary", "proj", "value", "fppg", "implied", "game_total", "gained_vol"]
floor = 0.005                # logit target floor: everything under 0.5% owned counts as 0.5% (all "contrarian")
min_proj = 2                 # fit on players projected >= this (drops never-used backups); predict for all
ridge = 10                   # L2 penalty on standardized coefficients
folds = 10                   # CV folds within a single week (with 2+ weeks, CV is leave-one-week-out)
max_weeks = 0                # use only the most recent N result weeks (0 = all)
chalk_qb_own = 10.0          # stacks.csv: flag a stack CHALK when its QB is projected >= this % owned
show_unused_own = 5.0        # exposure.csv also lists pool players we use 0 times if projected >= this % owned

# Leverage (off by default; one slate cannot validate it — see docs/phase2_ownership.md). Turn on per week in week.toml.
[optimizer.leverage]
enabled = false
own_weight = 0.1             # objective points subtracted per 1% projected ownership of each player (sum = lineup own)
max_lineup_own = 0           # hard cap on a lineup's summed projected ownership, in % (0 = off)
stack_exponent = 0.0         # stack-team draw weight *= (mean field QB own / team's field QB own) ** exponent (0 = off)
