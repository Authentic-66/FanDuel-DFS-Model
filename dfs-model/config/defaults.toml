# Rules that hold week to week. config/<week>/week.toml is deep-merged on top, so any key here can be overridden
# for a single week (e.g. [optimizer] exposure_cap = 40).

# --- FanDuel contest scoring (verified from Pooch Punt rules screenshot) ---
[scoring]
pass_yd = 0.04
pass_td = 4
interception = -1
rush_yd = 0.1
rush_td = 6
rec_yd = 0.1
rec_td = 6
reception = 0.5          # half PPR
return_td = 6
fumble_lost = -2
two_pt = 2
bonus = 3                # each of: 100+ rush yds, 100+ rec yds, 300+ pass yds
bonus_rush_yds = 100
bonus_rec_yds = 100
bonus_pass_yds = 300

[scoring.dst]
sack = 1
interception = 2
fumble_recovery = 2
return_td = 6
safety = 2
blocked_kick = 2
# points allowed (offensive TD/2pt/XP/FG only): pa < bound[i] scores points[i]; pa >= last bound scores pa_else
pa_bounds = [1, 7, 14, 21, 28, 35]
pa_points = [10, 7, 4, 1, 0, -1]
pa_else = -4

[roster]
salary_cap = 60000
max_per_team = 4                       # offensive players from one NFL team
slots = ["QB", "RB", "RB", "WR", "WR", "WR", "TE", "FLEX", "DEF"]   # upload header, exactly
flex = ["RB", "WR", "TE"]

[teams]
nflverse_to_fd = { JAX = "JAC", LA = "LAR" }

# --- Projection model ---
# Name aliases, nflverse display name -> FanDuel name, for players whose two names differ beyond case, punctuation and
# Jr./Sr./II/III (found Oct 18 by the role guard's "no 2026 usage data" list, weeks 4-6). Without an entry such a player
# has no stats and is projected from FanDuel FPPG alone (or 0 with the role guard on). Add new ones as they appear.
[names.aliases]
"Josh Palmer" = "Joshua Palmer"
"Marquise Brown" = "Hollywood Brown"
"Matthew Hibner" = "Matt Hibner"
"Nicholas Singleton" = "Nick Singleton"
"Mitchell Tinsley" = "Mitch Tinsley"
"Andrew Ogletree" = "Drew Ogletree"

[model]
n_sims = 10000
seed = 42
league_team_total = 22.5       # implied total that maps to a 1.0 scoring multiplier
volume_elasticity = 0.5        # usage scales by 1 + e * (implied/league - 1)
season_types = ["REG"]
skip_defense_names = true      # bug fix (Doug, Oct 18): drop defensive / specialist stat rows with no offensive volume
                               # before matching names, so Michael Carter II (PHI CB) no longer matches Michael Carter
                               # (TEN RB). Two-way players with targets/carries are kept. false = old matching.

[model.correlation]            # team scoring multiplier = exp(N(0,team_sd) + N(0,game_sd) + shift), game draw shared by both teams
team_sd = 0.22
game_sd = 0.12
shift = -0.03

# league per-opportunity priors; k = pseudo-opportunities of shrinkage
[model.priors]
ypa = { mean = 6.8, k = 60 }
pass_td = { mean = 0.045, k = 80 }
int = { mean = 0.022, k = 80 }
ypc = { mean = 4.3, k = 40 }
rush_td = { mean = 0.03, k = 40 }
catch_rate = { mean = 0.65, k = 20 }
ypt = { mean = 7.8, k = 30 }
rec_td = { mean = 0.045, k = 30 }

[model.qb]
min_attempts = 15          # drop QB game rows below this (cameos) from the stats entirely
prior_attempts = 33        # one pseudo-game of attempts
att_sd = 0.12
yds_sd = 0.15
yds_team_exp = 0.6         # passing yards scale with team factor ** exp
zero_backups = true        # QBs who are not the week's starter project 0 (they used to carry a starter's projection)

[model.rush]
att_sd = 0.2
att_team_exp = 0.3
yds_sd = 0.3

[model.rec]
tgt_sd = 0.25
tgt_team_exp = 0.3
yds_sd = 0.35
catch_rate_max = 0.85
catch_rate_floor = 0.3     # floor on catch rate when converting yds/target to yds/catch

[model.dst]
sacks = 2.6
turnovers = 1.3
turnover_total_exp = 0.5   # turnovers scale with (league / opp implied) ** exp
return_td_prob = 0.08
quality_shrink = 0.5       # quality = (1-s) + s * FPPG / league DST FPPG

[model.dst.flatten]        # Oct 12 2026 (docs/week6_prep.md): DST mean from opponent implied total and salary only
enabled = true
opp_implied = -0.35        # points per point of opponent implied total above the slate average
salary_per_1k = 0.35       # points per $1,000 of salary above the slate average

[model.fallback]           # players with no usable stats: FD FPPG with wide noise
sd = 0.5
total_exp = 0.5
team_exp = 0.5

# Role guard (week 7, docs/week7_prep.md section 7): skill players with no current-season stats (the fallback above,
# FanDuel FPPG alone) project 0, and RB / WR / TE averaging under min_volume targets + carries a game in their
# current-season games (before injury / trade routing) project 0. A read in [overrides] exempts the player.
[model.role_guard]
enabled = true             # Doug, Oct 18: on if the weeks 4-6 test was clean (docs/week7_prep.md section 7)
min_volume = 3.0
positions = ["WR", "TE"]   # role floor positions (Doug, Oct 18: keep RBs out). RB left out: RB backups who inherit the job get real work
                           # (Bam Knight 17 touches, week 6); add "RB" to apply Doug's spec to every skill position
report_min_proj = 3.0      # warnings list guarded players who would otherwise project at least this

[model.injury]
redistribute_share = 0.8           # share of newly-OUT players' targets/carries given to active teammates, pro rata
                                   # (used when routing = "pro_rata", and for any position/volume without a rule below)
routing = "position"               # Oct 12 2026 (docs/week6_prep.md section 9): "position" = split an OUT (or traded)
                                   # player's volume by position first, per [model.injury.position_share];
                                   # "pro_rata" = the rule through week 5: redistribute_share to every RB/WR/TE
within_position = "pro_rata"       # how the same-position part is divided (routing = "position" only):
                                   # "pro_rata" = in proportion to each teammate's own volume (week-6 freeze);
                                   # "depth_rank" = by the *_rank shares below (docs/week6_prep.md section 11): built
                                   #   and tested Oct 12 2026, NOT adopted, Doug and Claude decide
depth_rank_positions = ["WR", "RB", "TE"]   # with "depth_rank": the positions of the OUT player it applies to
                                   # (e.g. ["WR"] = depth split when a WR is out, pro rata when an RB or TE is)
questionable_inactive_prob = 0.45 # share of draws in which a player marked Q (held out of lineups anyway) scores 0.
                                   # Doug, Oct 26 (week 8): 0.45 (his Q lists sat 12 of 26; history Q + DNP 45%); 0.25 before
questionable_routing = true        # in the draws where an RB / WR / TE marked Q sits, his volume goes to his teammates,
                                   # routed like an OUT player's (docs/week8_prep.md section 3). Doug, Oct 26: ON from week 8
trade_old_team = "present_share"   # [[status.trade]], old team: "present_share" = his volume goes to old teammates like an
                                   # OUT player's under absent_mode present_share, fading as they play games without him
                                   # (Doug, Oct 26: fixes the ARI double count); "full" = in full every week (weeks 6-7)
absent_mode = "present_share"      # OUT players who already missed games (Oct 12 2026, docs/week6_prep.md):
                                   # "present_share" = hand out their volume for the share of each teammate's usage
                                   #   sample (current games + prior pseudo-games) they played in; fades as they stay out
                                   # "skip" = the Oct 10 behaviour, governed by skip_already_absent below
skip_already_absent = true         # absent_mode "skip" only: don't redistribute an OUT player who missed his team's last
                                   # game at all; false = hand everyone out in full (the behaviour before Oct 10 2026)

# Where an OUT player's per-game volume goes, by HIS position: *_same = share to teammates at his position, *_other =
# share to the other skill positions (pro rata inside each group; a group with no volume gets nothing).
# From the first game each starter missed, 2021-2025: 124 WRs, 105 RBs, 59 TEs (docs/phase2_history.md section 4).
# *_rank = [largest, second, third and lower]: how the same-position part was divided among the remaining teammates
# ranked by their own volume (third and lower share theirs equally; with fewer than three, the shares present are
# rescaled to 100%). Fit by src/fit_depth.py; used only with within_position = "depth_rank".
[model.injury.position_share]
WR = { tgt_same = 0.77, tgt_other = 0.16, tgt_rank = [0.204, 0.196, 0.601] }     # 93% of his targets reach teammates
RB = { car_same = 0.94, car_other = 0.01, car_rank = [0.575, 0.328, 0.096], tgt_same = 0.70, tgt_other = 0.0, tgt_rank = [0.473, 0.356, 0.171] }   # 95% of carries, 70% of targets
TE = { tgt_same = 0.46, tgt_other = 0.04, tgt_rank = [0.667, 0.269, 0.065] }     # 49% of targets (rounded to 50)

# Shrink applied to finished projections (fit by src/fit_calibration.py; docs/week6_prep.md). enabled = false turns it off.
[model.calibration]
enabled = true
mode = "shift"             # "shift" = lower the mean and keep the simulated spread (uncalibrated ceilings were about
                           # right: 10.9% of 16+ projections beat their p90); "scale" = shrink every draw in proportion
top_knee = 16.0            # every skill player: lose top_slope of each projected point above this
top_slope = 0.36           # 2021-2025 with Vegas totals, leave-one-season-out range 0.32-0.41 (docs/phase2_history.md);
                           # 0.28 until Oct 12 2026 (fit on 2025 wks 4-18 with neutral totals + 2026 wks 4-5)
rb_knee = 8.0              # RBs: also lose rb_slope of each projected point above this
rb_slope = 0.12            # (leave-one-week-out range 0.09-0.14)

# WR/TE over-react to the team implied total (docs/week7_prep.md section 3): after the calibration, each player's mean
# moves by b * mean * (implied / league_team_total - 1). Fit 2021-2025 leave-one-season-out: WR -0.34 (-0.29 to -0.41),
# TE -0.27 (-0.21 to -0.33). ON from week 7 (Doug, Oct 18, after the section 6 lineup test); TE kept at 0.
[model.implied_sensitivity]
enabled = true
WR = -0.34
TE = 0.0

# Wider simulated spread by position, applied after the calibration: every draw moves to this many times its distance
# from the player's mean; the mean (and so the projection) is unchanged. A number = the same factor for everyone at the
# position (1.0 or no entry = off). {low, top} = tapered: `low` for players projected up to [model.spread_taper] from,
# falling in a straight line to `top` at `to` and above, because the top projections' ceilings were already about right.
# Fit by src/fit_taper.py on 2021-2025 so that 10% of players beat their simulated 90th percentile, under 16 and from
# 16 up (docs/week6_prep.md section 9). Until then: RB = 1.376 only (section 8, src/fit_spread.py).
[model.spread]
QB = { low = 1.504, top = 1.0 }
RB = { low = 1.429, top = 1.04 }
WR = { low = 1.225, top = 1.0 }
TE = { low = 1.215, top = 1.215 }      # flat: too few TEs projected 16+ to fit a taper

[model.spread_taper]
from = 12.0
to = 20.0

# Opponent adjustment (docs/week6_prep.md section 10; dfs/opponent.py). OFF: not adopted, Doug and Claude decide.
# Each skill player's draws are multiplied by 1 + beta[position] * (tilt - 1), kept within 1 +/- cap. tilt = FanDuel
# points the opposing defence allows to his position relative to the league, divided by the same ratio over all
# positions, so only what the Vegas implied total does not already price is used. Games before the week only.
[model.opponent]
enabled = false
shrink_games = 16.0        # pseudo-games at league average
prior_games = 8.0          # pseudo-games of the defence's prior-season ratio
cap = 0.15                 # largest adjustment either way

[model.opponent.beta]      # filled by src/fit_opponent.py (2021-2025); 0 = no adjustment for the position
QB = 1.02                  # leave-one-season-out range 0.55 to 1.33
RB = 0.57                  # 0.35 to 0.72
WR = 0.17                  # 0.00 to 0.38
TE = 0.34                  # 0.19 to 0.46

# Phase 2 #1: shrink current-season usage/efficiency toward the prior season.
# Prior season adds `usage_games` pseudo-games of its per-game targets/carries/attempts, and `efficiency_games` games'
# worth of its per-opportunity outcomes (yds, TDs, catches) before the league-prior shrink. 0 = off.
[model.prior_blend]
usage_games = 2.0         # tuned Oct 5 2026: docs/phase2_prior_blend.md
efficiency_games = 4.0
team_change_weight = 1.0    # multiplier on both weights when the player's prior-season team differs
min_prior_games = 4         # ignore prior seasons shorter than this (injury-shortened samples)

# --- Optimizer (Doug's standing rules) ---
[optimizer]
n_lineups = 150
seed = 11
exposure_cap = 25            # every player and DST; raise to 40 only if infeasible
mean_weight = 0.6            # objective = mean_weight * proj + (1 - mean_weight) * one sim draw. 0.4 through week 5;
                             # Doug's call Oct 12 2026 after +1.0 / +1.8 on weeks 5 / 4 (docs/week6_prep.md 7.3)
max_overlap = 6              # max shared players between any two lineups
min_proj = 4                 # drop non-DST players projected below this (unless green)
exclude_questionable = true  # Doug's standing rule: pull Q players (incl. FanDuel Q/D tags before Friday's [status])
questionable_cap_pct = 0.12  # cap on Q players when exclude_questionable = false
yellow_factor = 0.5          # yellow = cap at this share of current exposure
green_multiplier = 2         # green = min max(mult * current, floor)
green_floor = 12
relax_force_after = 3        # failed solves before dropping forced players one at a time
drop_force_after = 12
stack_allocation = "random"  # "random": one weighted team draw per lineup; "proportional": stack counts fixed from the
                             # weights (largest-remainder rounding), so counts match the weights
reserve_required = false     # true: other stacks leave room on a player a green QB's stack rule requires (see week 5)
min_salary = 59000           # salary floor (Doug, week 7; docs/week6_review.md 8.1). 0 = off. Lineups that cannot reach
                             # it get cap relief below; if that fails too, the lineup is built without the floor
floor_cap_overflow = 2       # cap relief for floor lineups only: players at exposure_cap may go to cap + 2.
                             # Not yellow/player_cap. Week 7 used +3 (21 players above cap 27, 12 at 30). Doug, Oct 26:
                             # +2 from week 8 (+1 cost week 4 -2.2 a lineup and stalled week 7 at 147; docs/week8_prep.md 4)
flex_te_max_share = 0        # at most this share of lineups with a TE in the FLEX (0 = off). Built Oct 26
                             # (docs/week8_prep.md section 2); week 7 had 78%. NOT adopted: Doug and Claude decide

[optimizer.starters]         # depth kept per team when prefs.starters_only (QB = week's starter)
RB = 1
WR = 3
TE = 1

[optimizer.starters_min_proj]   # with depth > 1: a team's 2nd, 3rd... player at the position must project at least this
                                # (e.g. starters RB = 2 with RB = 8 here: a second RB only when he projects 8+)

[optimizer.stack]            # QB + receivers from his team + bring-back from opponent; teams overridable in week.toml
receivers = 2
bring_back = 1

# --- Doug's pool mode (docs/pool_mode.md): `optimize.py --pool` builds 150 lineups from [pool] in week.toml ---
# The lists (QB, RB, WR, TE, DST = names, optionally in rank order) go in week.toml; these are the settings.
[pool]
max_filler = 1       # players per lineup from outside the pool (must pass the role guard test; never the QB)
ranked = false       # week.toml: true = lists are in Doug's rank order -> objective boost by rank
rank_boost = 0.05    # rank 1 objective x 1.05, falling linearly to x 1.00 for the last listed (pending Doug's OK)
raise_cap_to = 40    # standing rule "raise to 40 only if infeasible", applied automatically to pool players only when
                     # the capacity check fails at exposure_cap (Doug's sizes need ~33+). 0 = stop with an error instead

# --- Phase 2 #2: field ownership (docs/phase2_ownership.md) ---
# Projected %Drafted from pre-lock info, fit on every earlier week with data/<week>/results_players.csv (refit each run).
[ownership]
enabled = true               # add Own_proj to proj.csv / projections.csv / exposure.csv when earlier results exist
features = ["log_salary", "proj", "value", "fppg", "implied", "game_total", "gained_vol"]
floor = 0.005                # logit target floor: everything under 0.5% owned counts as 0.5% (all "contrarian")
min_proj = 2                 # fit on players projected >= this (drops never-used backups); predict for all
ridge = 10                   # L2 penalty on standardized coefficients
folds = 10                   # CV folds within a single week (with 2+ weeks, CV is leave-one-week-out)
max_weeks = 0                # use only the most recent N result weeks (0 = all)
chalk_qb_own = 10.0          # stacks.csv: flag a stack CHALK when its QB is projected >= this % owned
show_unused_own = 5.0        # exposure.csv also lists pool players we use 0 times if projected >= this % owned

# Leverage (off by default; one slate cannot validate it — see docs/phase2_ownership.md). Turn on per week in week.toml.
[optimizer.leverage]
enabled = false
own_weight = 0.1             # objective points subtracted per 1% projected ownership of each player (sum = lineup own)
max_lineup_own = 0           # hard cap on a lineup's summed projected ownership, in % (0 = off)
stack_exponent = 0.0         # stack-team draw weight *= (mean field QB own / team's field QB own) ** exponent (0 = off)
