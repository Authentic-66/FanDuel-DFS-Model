  "Ronnie Rivers", "Jonathon Brooks", "Will Shipley", "Jaxson Dart", "Terry McLaurin", "Chris Brooks",
  "Mack Hollins", "Jalen Hurts", "Raheim Sanders", "Terrance Ferguson", "Jayden Reed", "David Njoku",
  "Romeo Doubs", "Jaylin Noel", "Tyquan Thornton", "Tyrone Tracy Jr.", "Alec Pierce", "Pat Bryant",
  "Demarcus Robinson", "Xavier Legette",
]
questionable = [
  # FanDuel Q, Nov 3 (30)
  "Breece Hall", "Cam Skattebo", "Christian McCaffrey", "Jeremiyah Love", "David Montgomery", "Michael Wilson",
  "DeVonta Smith", "TreVeyon Henderson", "Christian Watson", "Bam Knight", "A.J. Brown", "Mike Evans",
  "Deebo Samuel Sr.", "Dontayvion Wicks", "Rashid Shaheed", "Hunter Henry", "CJ Donaldson", "Jake Ferguson",
  "Velus Jones Jr.", "Colby Parkinson", "Brenen Thompson", "Theo Johnson", "Matthew Stafford", "KaVontae Turpin",
  "Drew Lock", "Luke Schoonmaker", "Britain Covey", "Anthony Gould", "Dean Connors", "Jacob Saylors",
