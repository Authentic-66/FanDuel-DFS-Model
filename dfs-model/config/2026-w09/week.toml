active = []

[status.starting_qb]

# Traded players. Houston IS on the main slate (HOU@LAC), so the Houston side runs for the first time since week 7.
# Doug, Oct 26: share 0.15, factor 0.9 (13.3% of HOU targets over his two HOU games, weeks 6-7; 19-21% of snaps).
# Remove the entry after ~3 HOU games (week 9 is his third).
[[status.trade]]
player = "Marvin Harrison Jr."
position = "WR"
from = "ARI"
to = "HOU"
new_target_share = 0.15        # Doug, Oct 26
first_week_factor = 0.9        # Doug, Oct 26 (0.7 in week 7)

# Doug's projection reads: new mean FanDuel points.
[overrides]

# Depth split for WRs only (Doug, Oct 12), kept. bump_scale NOT set: the week-9 default (RB 0.8 / WR 0.45 / TE 0.3) runs.
[model.injury]
within_position = "depth_rank"
depth_rank_positions = ["WR"]

[optimizer]
stack_allocation = "proportional"   # stack counts follow the weights exactly instead of random draws

[prefs]
starters_only = true
red_teams = []
red = []

[prefs.yellow]                 # empty: yellow is shadow-only (Doug, Oct 26)

[prefs.green]                  # empty: green is shadow-only

[prefs.green_floor]

[prefs.starter_override]

[prefs.player_cap]

# Record only: NOT applied.
[shadow]
red = []

[shadow.red_lineups]

[shadow.yellow]

[shadow.green]

[shadow.green_floor]

[shadow.trade]
"Marvin Harrison Jr." = { from = "ARI", to = "HOU", new_target_share = 0.15, first_week_factor = 0.9 }   # Doug, Oct 26

