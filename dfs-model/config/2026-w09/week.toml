# Week 9 settings (2026-w09). Made Nov 3 from 2026-w08's week.toml with the week-specific parts emptied and the
# as-entered pins DELETED (week 8 pinned bump_scale 1.0 and one_sided false / WR -0.34 to re-run as entered).
# Overrides any key in config/defaults.toml. Standing rules come from defaults: starters only, 25-lineup cap, leverage off,
# salary floor $59,000 with cap relief +2, role guard, Harrison's old team (ARI) by present share, questionable routing
# ON at 0.45. NEW DEFAULTS FROM WEEK 9 (Doug, Nov 2; docs/week9_tests.md s2-3): WR implied-total correction one-sided at
# -0.57 ([model.implied_sensitivity] one_sided = true) and the position-scaled injury bump ([model.injury] bump_scale
# RB 0.8 / WR 0.45 / TE 0.3). Neither is pinned here, so both run.
# READS: red applied ([prefs] red); yellow and green shadow-only ([shadow.yellow], [shadow.green]). Doug will green RBs
# with clear role increases (shadow only); the week-9 review grades them vs projection and salary-matched RBs.
# Schedule (nflverse schedule_2026.csv, Nov 3). Main slate = Sunday 1:00 / 4:05 / 4:25 ET, 11 games / 22 teams
# (matches FanDuel's list, 568 players):
#   DEN@CAR, DAL@IND, NYJ@KC, DET@MIA, CLE@NO, NYG@PHI, LAR@WAS, HOU@LAC, LV@SF, GB@NE, ARI@SEA.
# Off the main slate: JAX@BAL (Thu), CIN@ATL (London, 9:30 ET), TB@CHI (SNF), BUF@MIN (MNF). Byes: PIT, TEN.
# So BAL (Lamar) and TB are not on the slate: no starting-QB call needed for either.
# Player list: re-download Friday and Sunday morning and diff (python src/diff_players.py <old> <new>).

