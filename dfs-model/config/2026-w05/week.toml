# Week 5 settings (2026-w05). Made from 2026-w04's week.toml with the week-specific parts reset. Overrides any key in
# config/defaults.toml. Standing rules come from defaults: starters only, 25-lineup cap, leverage off.

# Friday's official game statuses go here (skill positions). While both lists are empty, FanDuel's own tags apply:
# O/IR = out, Q/D = questionable, and questionable players are excluded ([optimizer] exclude_questionable, default true).
# Once anything is listed here, FanDuel's Q/D tags are ignored and these lists decide (O/IR tags still apply).
# Filled Oct 10 from data/2026-w05/Injury Report/Wk_5 NFL Injuries.docx (ESPN format, statuses as of Fri Oct 9).
# QB/RB/WR/TE on main-slate teams only. Out and Doubtful -> out; Questionable -> questionable. Players on injured
# reserve are left to FanDuel's IR tag (as in week 4: listing them here would hand their old volume to teammates a
# second time), except Pat Bryant, who went on IR Friday and whom FanDuel still tags D.
[status]
# FINAL (Sun Oct 11, ~30 min before lock), from Doug's read of the ESPN inactives: every FanDuel Q tag on a main-slate
# team is cleared (questionable = []); the Friday outs stay; Sunday inactives added. Tank Dell is on IR (FanDuel tag);
# Zach Charbonnet is not in FanDuel's player list.
out = [
  "Marvin Harrison Jr.",                                   # ARI (FanDuel shows no tag)
  "Caleb Williams", "Kyle Monangai",                       # CHI (Bagent starts)
  "Tylan Wallace", "Carsen Ryan",                          # CLE
  "Pat Bryant",                                            # DEN (IR Oct 9)
  "Chris Brooks",                                          # GB
  "Ashton Dulin", "Darius Slayton",                        # IND
  "Jalen Nailor",                                          # LV
  "Quentin Johnston", "Ladd McConkey", "Brenen Thompson", "Trey Lance",   # LAC
  "Caleb Douglas", "Justin Joly",                          # MIA
  "Jordan Addison",                                        # MIN
  "Mack Hollins", "Reggie Gilliam",                        # NE
  "Devin Singletary",                                      # NYG
  "Breece Hall", "Adonai Mitchell",                        # NYJ
  "Michael Pittman Jr.", "Rico Dowdle",                    # PIT
  "George Holani",                                         # SEA
  "Kyle Juszczyk",                                         # SF
  "Nick Singleton", "Michael Carter",                      # TEN
  "Marcus Mariota", "Stefon Diggs", "Kaytron Allen",       # WAS
]
questionable = []

# Doug's starting-QB calls, team -> name. Default is the QB with the most attempts in the team's last game.
[status.starting_qb]
WAS = "Jayden Daniels"         # not on the injury report (cleared); Mariota out, Kaliakmanis started week 4
CHI = "Tyson Bagent"           # Caleb Williams inactive (Doug, Oct 11)

# Doug's projection reads: new mean FanDuel points (the player's sims are rescaled to it).
[overrides]

[optimizer]
mean_weight = 0.4              # as entered: the default became 0.6 in week 6 (keeps the review's re-runs faithful)
min_salary = 0                 # as entered: the salary floor became the default in week 7
stack_allocation = "proportional"   # stack counts follow the weights exactly instead of random draws

# Week 5 is entered model-only (Doug, Oct 10): no red/yellow/green and no overrides are applied. His colour review is
# kept under [shadow] below. Comparison runs made with it applied, archived in weeks/2026-w05/: floor/ (green = forced
# minimum, CIN weight 3, CIN rule Burrow + Chase Brown + 1 receiver, reserve_required), boost/ (green_mode "boost",
# green_boost 0.15, random stack draws) and hybrid/ (green_boost 0.30, green_qb_weight 2.0, proportional stacks).
[prefs]
starters_only = true           # QB1, RB1, top-3 WR, TE1 per team (by projection); green players always eligible
red_teams = []
red = []

[prefs.yellow]

[prefs.green]

[prefs.green_floor]

[prefs.player_cap]             # hard per-player lineup caps (overrides exposure_cap)

