# Stack QB-team weights (relative), for all 22 main-slate teams (11 games), all from the implied-total formula:
# weight = round(2 * (implied total - 16)), min 1, from data/2026-w05/lines.csv (bet365 Oct 5).
# Phase 2 #3 replaces this with Vegas-derived weights in code.
[stacks.weights]
DET = 26   # 29.0 vs ARI
CIN = 18   # 25.0 @ MIA (Chase and Higgins are Q and excluded)
SEA = 18   # 25.0 vs SF
NE = 17    # 24.5 vs LV
ARI = 17   # 24.5 vs DET
CHI = 16   # 23.75 @ GB; back to the formula Oct 11 (Bagent starts)
WAS = 16   # 23.75 vs NYG
PIT = 15   # 23.5 vs IND
HOU = 14   # 23.25 @ TEN
DEN = 14   # 23.0 @ LAC
SF = 13    # 22.5 @ SEA
MIN = 11   # 21.5 @ NO
IND = 10   # 21.0 @ PIT
NYJ = 10   # 21.0 vs CLE
