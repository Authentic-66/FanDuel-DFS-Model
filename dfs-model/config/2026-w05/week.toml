LAC = 7    # 19.5 vs DEN
CLE = 7    # 19.5 @ NYJ
MIA = 3    # 17.5 vs CIN
TEN = 1    # 16.25 vs HOU

# No per-team stack rules: every team uses [optimizer.stack], QB + 2 receivers + 1 bring-back.
[stacks.rules]

[contest]
field_size = 571483            # $35K Pooch Punt, Oct 11

# FanDuel Guru suggestions, pre-lock (candidate ownership feature; see config/2026-w04/week.toml for the format notes).
# Per slot: the 3 players Guru suggested, in its order, and the one Doug picked. Screenshots of each slot are fine:
# Claude transcribes them here. Leave empty if Guru isn't used this week.
[contest.guru]
# Transcribed Oct 10 from data/2026-w05/Doug's Guru Picks (9 suggestion screens + the entered lineup, Oct 8 7:13-7:17 PM).
# Guru does not go slot by slot: each screen offers 3 players of mixed positions, and names that weren't picked come
# back on later screens (PIT DST x3; J. Love, Kraft, Burden, MIN DST x2). Each screen is filed under the slot its pick
# filled in the entered lineup, so "options" can hold other positions. 21 distinct players were suggested.
# Screens 4-7 share a 7:15 timestamp; their order is from the file names, and each pick is the one option that is in
# the entered lineup and not shown again on a later screen.
adapts = "yes"                 # unpicked names are re-offered and the position mix follows the open slots
fill_order = ["QB", "RB1", "RB2", "FLEX", "WR1", "WR2", "DEF", "TE", "WR3"]
QB = { options = ["Drake Maye", "Tyler Shough", "Jared Goff"], picked = "Jared Goff" }
RB1 = { options = ["Jahmyr Gibbs", "Amon-Ra St. Brown", "Jameson Williams"], picked = "Jahmyr Gibbs" }
RB2 = { options = ["Jaylen Warren", "Jeremiyah Love", "Braelon Allen"], picked = "Jaylen Warren" }
FLEX = { options = ["Pittsburgh Steelers", "Aaron Jones Sr.", "Jeremiyah Love"], picked = "Aaron Jones Sr." }
WR1 = { options = ["Pittsburgh Steelers", "Minnesota Vikings", "Romeo Doubs"], picked = "Romeo Doubs" }
WR2 = { options = ["Jaylen Waddle", "Matthew Golden", "KC Concepcion Jr."], picked = "Matthew Golden" }
DEF = { options = ["Minnesota Vikings", "Pittsburgh Steelers", "Tucker Kraft"], picked = "Minnesota Vikings" }
TE = { options = ["Tucker Kraft", "Luther Burden III", "Tre' Harris"], picked = "Tucker Kraft" }
WR3 = { options = ["Luther Burden III", "Michael Wilson", "Malik Washington"], picked = "Michael Wilson" }

[model.injury]
questionable_routing = false     # as entered: questionable routing became the default Oct 26 (week 8)
questionable_inactive_prob = 0.25 # as entered (0.45 from week 8)

[model.role_guard]
enabled = false                # as entered: the role guard became the default in week 7

[model.implied_sensitivity]
enabled = false                # as entered: the WR implied-total correction became the default in week 7
