# Week 6 settings (2026-w06). Made Oct 12 from 2026-w05's final week.toml with the week-specific parts emptied.
# Overrides any key in config/defaults.toml. Standing rules come from defaults: starters only, 25-lineup cap, leverage off.
# Week-6 mode (Doug, Oct 12): his RED and YELLOW reads are APPLIED ([prefs]); GREEN is recorded under [shadow] only.
# Based on weeks 4-5, where red + yellow were worth +3.0 and +2.5 points per lineup and green was +1.3 and -1.7.
# Oct 13 preliminary run: [status] and [stacks.weights] hold PRELIMINARY values (FanDuel tags, nflverse lines).
# TO REPLACE before the final run: [status] (Friday report), [stacks.weights] (Saturday's lines in
# data/2026-w06/lines.csv), Doug's reads, and [contest.guru] if Guru is used.

# Friday's official game statuses go here (skill positions). While both lists are empty, FanDuel's own tags apply:
# O/IR = out, Q/D = questionable, and questionable players are excluded ([optimizer] exclude_questionable, default true).
# Once anything is listed here, FanDuel's Q/D tags are ignored and these lists decide (O/IR tags still apply).
# Players on injured reserve are left to FanDuel's IR tag. A player listed out who already missed games is now handed
# out in proportion to the games he played ([model.injury] absent_mode = "present_share"), so keep listing him.
# PRELIMINARY (Tue Oct 13): no Friday report yet, so these lists mirror FanDuel's own tags in the Oct 13 player list
# (data/2026-w06/fd_players.csv), skill positions and QBs: O -> out, Q and D -> questionable (FanDuel's tag rule).
# They are listed rather than left empty so the O players' volume is handed to their teammates (Routing_bump); an
# empty [status] applies the same tags but redistributes nothing. IR players are left to FanDuel's IR tag.
# Baker Mayfield (TB, O) is a QB: out through FanDuel's tag, no volume to hand out.
# REPLACE with Friday's report before the final run.
[status]
out = [
  "Roman Wilson", "Ben Skowronek",                         # PIT (finger, calf)
  "Tyler Scott",                                           # LV
]
questionable = [
  "Michael Penix Jr.",                                     # ATL (ribs)
  "Lamar Jackson",                                         # BAL (ankle)
  "Joshua Palmer",                                         # BUF
  "Jalen Coker",                                           # CAR
  "Caleb Williams", "Kyle Monangai",                       # CHI
  "Quinshon Judkins", "KC Concepcion Jr.", "Tylan Wallace", "Carsen Ryan",   # CLE
  "Darius Slayton", "Ashton Dulin",                        # IND
  "Rashee Rice",                                           # KC
  "Ladd McConkey", "Quentin Johnston", "Brenen Thompson", "Tre' Harris",     # LAC (Harris tagged D)
  "Jalen Nailor",                                          # LV
  "TreVeyon Henderson",                                    # NE (tagged D)
  "Breece Hall", "Adonai Mitchell", "Kenyon Sadiq",        # NYJ
  "Saquon Barkley", "DeVonta Smith", "Hollywood Brown", "Will Shipley",      # PHI (Shipley tagged D)
  "Rico Dowdle",                                           # PIT
  "David Martin-Robinson",                                 # TEN
]

# Doug's starting-QB calls, team -> name. Default is the QB with the most attempts in the team's last game.
# Every other QB now projects 0 ([model.qb] zero_backups); a team with no starter flagged prints a warning.
[status.starting_qb]

# Traded players. Old team: handled like a player ruled out for the first time (his volume goes to his old teammates
# in full). New team: he gets new_target_share of the team's targets per game, taken from his new teammates pro rata;
# first_week_factor (optional, default 1.0) scales that share while he learns the offence. new_target_share has no
# default: while it is missing and he is on the slate, the run stops instead of guessing. Remove the entry once his
# new-team games carry his role (about three games).
# Week 6: Houston plays in London (HOU @ JAC, Sunday 9:30) and is not on the main slate, so Harrison is not in the
# player list and only the Arizona side applies: his targets go to his old teammates. `position` is needed for that
# (he cannot be looked up on the slate); without it his volume falls back to the 80% pro-rata rule.
[[status.trade]]
player = "Marvin Harrison Jr."
position = "WR"                # added Oct 13: routes his Arizona targets by position (WR depth split), he is off the slate
from = "ARI"
to = "HOU"
new_target_share = 0.15        # Doug's read (Oct 12): his share of Houston's targets once settled
first_week_factor = 0.7        # first game in the offence: 0.15 x 0.7 = 10.5% of Houston's targets this week

# Doug's projection reads: new mean FanDuel points (the player's sims are rescaled to it).
[overrides]

# Doug, Oct 12: when a WR is out (or traded away), his targets inside the WR group are split by depth rank
# (20% largest remaining role, 20% second, 60% third and lower) instead of pro rata. RB and TE absences stay pro rata.
# docs/week6_prep.md section 11. Check the exposure sheet's Routing_bump column for depth receivers lifted into lineups.
[model.injury]
within_position = "depth_rank"
depth_rank_positions = ["WR"]

[optimizer]
stack_allocation = "proportional"   # stack counts follow the weights exactly instead of random draws

# Doug's colour review of the exposure sheet (numbers = that run's lineups out of 150).
# APPLIED: red = exclude (players, DSTs by full name; whole teams under red_teams); yellow = cap at half the number listed.
# NOT applied: green. Leave [prefs.green] and [prefs.green_floor] empty and put green under [shadow.green] below.
[prefs]
starters_only = true           # QB1, RB1, top-3 WR, TE1 per team (by projection)
red_teams = []                 # nothing from these teams
red = []

[prefs.yellow]                 # "Player" = lineups he had in the reviewed run

[prefs.green]                  # keep empty in week 6 (green is shadow-only)

[prefs.green_floor]            # keep empty in week 6

[prefs.player_cap]             # hard per-player lineup caps (overrides exposure_cap)

# Record only: NOT applied (the model and optimizer never read [shadow]; analyze_results.py grades it after the games).
# Week 6: Doug's GREEN reads go here (green = more: min max(2x listed, 12), or the floor). red / yellow stay empty
# here because they are applied through [prefs] above; anything listed here would be graded as a shadow read.
[shadow]
reviewed = ""                  # path of the reviewed sheet, e.g. "data/2026-w06/exposure_reviewed.xlsx"
red = []

[shadow.red_lineups]           # lineups each red player had in the reviewed run (red is applied, so record them here)

[shadow.yellow]

[shadow.green]                 # "Player" = lineups he had in the reviewed run

[shadow.green_floor]           # per-player floor instead of 12

# Doug's trade reads. Unlike the colours these ARE applied (through [[status.trade]] above, which has no default);
# the copy here is so the read can be scored against his actual share of the new team's targets after the games.
[shadow.trade]
"Marvin Harrison Jr." = { from = "ARI", to = "HOU", new_target_share = 0.15, first_week_factor = 0.7 }

# Stack QB-team weights (relative), one per main-slate team (20 teams, 10 games), from the implied-total formula used
# in week 5: weight = round(2 * (implied total - 16)), min 1, from data/2026-w06/lines.csv.
# PRELIMINARY (Oct 13): the lines are the nflverse schedule's spread_line / total_line; redo from Saturday's lines.
[stacks.weights]
LAR = 32   # 32.0 vs ARI
BUF = 27   # 29.5 @ LV
CHI = 20   # 26.25 @ ATL (Caleb Williams Q; Bagent has the starter flag)
IND = 20   # 25.75 vs TEN
NE = 19    # 25.5 vs NYJ
KC = 19    # 25.5 vs LAC
LV = 16    # 24.0 vs BUF
NO = 15    # 23.5 @ NYG
ATL = 14   # 23.25 vs CHI (Penix Q)
BAL = 14   # 23.0 @ CLE (Lamar Jackson Q; Huntley has the starter flag)
NYG = 12   # 22.0 vs NO
PHI = 10   # 21.0 vs CAR
PIT = 10   # 21.0 @ TB
CAR = 7    # 19.5 @ PHI
ARI = 7    # 19.5 @ LAR
TEN = 6    # 18.75 @ IND
CLE = 5    # 18.5 vs BAL
TB = 5     # 18.5 vs PIT (Mayfield out)
NYJ = 4    # 18.0 @ NE
LAC = 2    # 17.0 @ KC

# No per-team stack rules: every team uses [optimizer.stack], QB + 2 receivers + 1 bring-back.
[stacks.rules]

[contest]
field_size = 0                 # fill in after the slate (for grading)

# FanDuel Guru suggestions, pre-lock (see config/2026-w05/week.toml for a filled-in example and the format notes).
# Per slot: the 3 players Guru suggested, in its order, and the one Doug picked. Leave empty if Guru isn't used.
[contest.guru]
