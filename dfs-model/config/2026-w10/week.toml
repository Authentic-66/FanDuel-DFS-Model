# Week 10 settings (2026-w10). Made Nov 12 from 2026-w09's week.toml with the week-specific parts emptied.
# Overrides any key in config/defaults.toml. Standing rules come from defaults: starters only, 25-lineup cap, leverage off,
# salary floor $59,000 with cap relief +2, role guard (promotion ON), questionable routing ON at 0.45, WR one-sided
# implied correction -0.57, bump_scale RB 0.8 / WR 0.45 / TE 0.3. NO as-entered pins here (none carried over).
# ENTRY (Doug, Nov 12): model 149 (model-led), free entry separate. Shadows graded, not entered: median-70 (with a
# 30% cap on injury-promoted players), plain median-70 and its three variants (v1 flex, v2 stack, v3 repeats), no-draw,
# cap 45, pool, flex shadow.
# Harrison trade entry REMOVED (Doug, Nov 9/12: three HOU games played; he is now a normal HOU player).
# READS: red applied ([prefs] red); yellow and green shadow-only ([shadow.yellow], [shadow.green]).
# Schedule (nflverse games.csv, Nov 12). Main slate = Sunday 1:00 / 4:05 / 4:25 ET, 10 games / 20 teams
# (matches FanDuel's list, 503 players):
#   KC@ATL, HOU@CLE, MIN@GB, MIA@IND, CAR@NO, BUF@NYJ, JAC@TEN, LAR@ARI, SEA@LV, SF@DAL.
# Off the main slate: WAS@NYG (Thu), NE@DET (London, 9:30 ET), PIT@CIN (SNF), LAC@BAL (MNF). Byes: CHI, DEN, PHI, TB.
# DEN is on bye: the Coleman vs Dobbins check waits for week 11.
# Player list: re-download Friday and Sunday morning and diff (python src/diff_players.py <old> <new>).

# PRELIM (Thu Nov 12): FanDuel's list (data/2026-w10/fd_players.csv, downloaded Nov 12 07:56) O / D -> out, Q ->
